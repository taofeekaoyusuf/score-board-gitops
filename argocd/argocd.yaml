apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scoreBoard-app-pipeline
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/taofeekaoyusuf/scoreBoard.git'
    targetRevision: HEAD
    path: argocd
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true